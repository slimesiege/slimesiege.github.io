function openRecruit() {
  if (!canRecruit()) { recruitPending = 0; if (pending > 0) openLevel(); else state = "play"; return; }

}
function recruit(def) {
  addComp(def.name); recruitPending--; sfx.pickup();
  if (recruitPending > 0 && canRecruit()) { rollRecruit(); state = "recruit"; return; }
  recruitPending = 0;
  if (pending > 0) openLevel(); else state = "play";
}
function openLevel() {
  const pool = [];
  for (const id in WDEF) if ((wl[id] || 0) < 5) pool.push({ kind: "w", id });
  for (const id in PDEF) if ((pl[id] || 0) < 5) pool.push({ kind: "p", id });
  const out = [];
  while (out.length < 3 && pool.length) out.push(pool.splice(rint(0, pool.length - 1), 1)[0]);
  while (out.length < 3) out.push({ kind: "heal", id: "chicken" });
  if (canRecruit() && !out.some(o => o.kind === "recruit") && (level % 3 === 0 || Math.random() < 0.1)) out[rint(0, out.length - 1)] = { kind: "recruit", id: "recruit" };
  choices = out; state = "level"; sfx.level();
}
function applyChoice(c) {
  if (c.kind === "w") wl[c.id] = (wl[c.id] || 0) + 1;
  else if (c.kind === "p") {
    pl[c.id] = (pl[c.id] || 0) + 1;
    if (c.id === "heart") { P.hp = Math.min(stat().maxhp, P.hp + 25); }
  } else if (c.kind === "recruit") recruitPending++;
  else P.hp = Math.min(stat().maxhp, P.hp + stat().maxhp * 0.5);
  pending--; levelTitle = "LEVEL UP!";
  if (pending > 0) openLevel(); else if (recruitPending > 0) openRecruit(); else state = "play";
  sfx.pickup();

  txt("⬆ UPGRADE STATS", W / 2, y + 22, Math.min(32, W / 12), "#ffd23f");
  const pts = upPoints(), ai = acctInfo();
  txt("Wizard Level " + ai.lvl + "  ·  " + pts + " point" + (pts === 1 ? "" : "s") + " to spend  (1 per level)", W / 2, y + 56, 14, pts > 0 ? "#fff" : "#9fb4c6", "center", 700); y += 78;
  for (const u of UPS) {
    const r = upRank(u.id), max = r >= 10, c = upCost(r), can = !max && pts >= c, rh = 74;
    panel(x, y, pw, rh, "rgba(15,22,32,.92)", can ? "#ffd23f" : "#3b5268");
    ctx.font = "30px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff"; ctx.fillText(u.icon, x + 34, y + 30);
    txt(u.name + "  ·  Rank " + r + " / 10", x + 66, y + 22, 16, "#fff", "left"); txt(u.d, x + 66, y + 44, 11, "#9fb4c6", "left", 600);
    for (let i = 0; i < 10; i++) { ctx.fillStyle = i < r ? "#ffd23f" : "rgba(255,255,255,.14)"; ctx.fillRect(x + 66 + i * 15, y + 56, 12, 7); }
    const bw = 92; button(x + pw - bw - 10, y + 17, bw, 40, max ? "MAX" : can ? "+1  (" + c + " pt)" : "(" + c + " pt)", () => buyUp(u.id), max ? "#6bf0b0" : can ? "#ffd23f" : "#6a7886", 14);
    y += rh + 8;
  }
  y += 4; const bw2 = (pw - 12) / 2;
  button(x, y, bw2, 44, "↺  Reset (refund)", resetUps, "#ff9a9a", 15); button(x + bw2 + 12, y, bw2, 44, "‹  Back", () => { state = "menu"; beep(520, 0.08, "triangle", 0.05); }, "#6bf0b0", 16);
  txt("Earn points by levelling your wizard — each run gives XP. Ranks 6–10 cost 2 points.", W / 2, y + 66, 11, "#789", "center", 600);
}
function drawPause() {
  uiLock = false;
  ctx.fillStyle = "rgba(5,10,18,.7)"; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(340, W - 30), ph = 330, x = W / 2 - pw / 2, y = Math.max(8, H / 2 - ph / 2);
  panel(x, y, pw, ph);
  txt("PAUSED", W / 2, y + 42, 40, "#fff");
  txt(DF.icon + " " + DF.name + "  ·  " + hero.name + "  ·  " + fmt(time), W / 2, y + 76, 13, "#9fb4c6", "center", 600);
  button(x + 30, y + 100, pw - 60, 44, "▶  Resume", () => { paused = false; }, "#6bf0b0");
  button(x + 30, y + 154, pw - 60, 44, "↻  Restart run", startFromMenu, "#ffd23f");
  button(x + 30, y + 208, pw - 60, 44, muted ? "🔇  Sound: OFF" : "🔊  Sound: ON", () => { muted = !muted; }, "#6fd0ff");
  button(x + 30, y + 262, pw - 60, 44, endless ? "🏁  End run & bank XP" : "☰  Quit to menu", quitRun, "#ff7b8a");
}
function drawEnd(win) {
  uiLock = false;
  ctx.fillStyle = win ? "rgba(255,230,120,.12)" : "rgba(80,0,10,.38)"; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(500, W - 24), ph = 590, cx = W / 2, x = cx - pw / 2, y = Math.max(8, H / 2 - ph / 2);
  panel(x, y, pw, ph);
  txt(win ? "VICTORY!" : endless ? "♾ RUN OVER" : "YOU WERE SLIMED", cx, y + 42, Math.min(42, pw / 11), win ? "#ffd23f" : "#ff5a6e");
  txt(DF.icon + " " + DF.name, cx, y + 78, 16, DF.color);
  let ly = y + 114;
  const L = (a, b, col = "#fff") => { txt(a, x + 40, ly, 17, "#9fb4c6", "left", 600); txt(b, x + pw - 40, ly, 20, col, "right"); ly += 30; };
  L("Time", endless ? fmt(time) : fmt(time) + " / " + fmt(WIN_TIME)); L("Slain", String(kills));
  if (endless) { L("Slime Kings slain", String(kingsKilled)); L("Giant Spiders slain", String(spidersKilled)); }
  else { L("Slime Kings", kingsKilled + " / " + KINGS_NEEDED, kingsKilled >= KINGS_NEEDED ? "#6bf0b0" : "#fff"); L("Giant Spider", spiderDead ? "Slain" : (spiderSpawned ? "Alive" : "Unseen"), spiderDead ? "#6bf0b0" : "#fff"); } L("Level", String(level)); L("Wizard", hero.name + (CP.length ? "  +" + CP.length : ""));
  if (run.absorbed > 0) L("Damage tanked", String(Math.round(run.absorbed)), "#9ccaff");
  if (run.healed > 0) L("Healed by Lumen", String(Math.round(run.healed)), "#fff2a0");
  if (lastGain) {
    L("Wizard XP", "+" + lastGain.gain, "#c9a8ff");
    const ai = acctInfo(); txt("⭐ Wizard Level " + ai.lvl + "  (" + ai.cur + " / " + ai.need + ")", cx, ly + 4, 15, "#fff");
    ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(x + 40, ly + 18, pw - 80, 8); ctx.fillStyle = "#c9a8ff"; ctx.fillRect(x + 40, ly + 18, (pw - 80) * clamp(ai.cur / ai.need, 0, 1), 8); ly += 38;
    if (lastGain.slotUp) { txt("🧙 +1 STARTING COMPANION SLOT!  (" + lastGain.slots + " now)", cx, ly + 4, 15, "#6bf0b0"); ly += 24; }
    if (lastGain.up) { txt("LEVEL UP!  +" + lastGain.pts + " upgrade point" + (lastGain.pts > 1 ? "s" : "") + "  (" + upPoints() + " to spend)", cx, ly + 4, 15, "#ffd23f"); ly += 24; }
  }
  if (endNote) txt(endNote, cx, ly + 10, 18, "#ffd23f");
  if (overT > 0.8) { const bw = (pw - 90) / 2, by = y + ph - 62; button(x + 30, by, bw, 44, "▶  Play again", startFromMenu, "#6bf0b0"); button(x + 60 + bw, by, bw, 44, "☰  Menu", toMenu, "#9fb4c6"); }
}

function render() {
  ctx.fillStyle = "#2b4a3a"; ctx.fillRect(0, 0, W, H);
  rects = []; uiLock = false;
  const inMenu = state === "menu" || state === "companions" || state === "upgrades";
  if (inMenu) { camX = Math.cos(menuT * 0.3) * 300; camY = Math.sin(menuT * 0.25) * 300; }
  else if (P) { camX = P.x; camY = P.y; }
  ctx.save();
  const sx = shake > 0 ? rnd(-shake, shake) * 0.6 : 0, sy = shake > 0 ? rnd(-shake, shake) * 0.6 : 0;
  ctx.translate(Math.round(W / 2 - camX + sx), Math.round(H / 2 - camY + sy));
  if (inMenu) drawGround(); else drawWorld();
  ctx.restore();
  if (freeze > 0 && !inMenu) { ctx.fillStyle = `rgba(90,170,255,${0.12 + 0.05 * Math.sin(time * 10)})`; ctx.fillRect(0, 0, W, H); }
  if (inMenu) { if (state === "companions") drawCompanionScreen(); else if (state === "upgrades") drawUpgradeScreen(); else drawMenu(); }
  else {
    drawScreenFx(); drawHUD(); drawAbility(); drawDeflectBtn(); drawRadBtn(); drawSprintBtn(); drawCompHud(); drawMedArrows(); drawZoneArrows();
    if (state === "level") drawLevel();
    if (state === "recruit") drawRecruit();
    if (paused && state === "play") drawPause();
    if (state === "over") drawEnd(false);
    if (state === "win") drawEnd(true);
  }
  // vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.4)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (P && P.hurt > 0 && state === "play") { ctx.fillStyle = `rgba(255,40,60,${P.hurt * 0.8})`; ctx.fillRect(0, 0, W, H); }
}

/* ================= input ================= */
const pointer = { x: -999, y: -999 };
function scrollObj() { return state === "menu" ? menuS : state === "companions" ? grids.cat : (state === "recruit" && recAll) ? grids.rec : null; }
function clickRects() { for (const r of rects) if (pointer.x >= r.x && pointer.x <= r.x + r.w && pointer.y >= r.y && pointer.y <= r.y + r.h) { r.fn(); return true; } return false; }
function closeCompanions() { state = "menu"; beep(520, 0.08, "triangle", 0.05); }
addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  audio();
  if (!e.repeat) {
    const c = e.code, dm = /^(?:Digit|Numpad)(\d)$/.exec(c), num = dm ? parseInt(dm[1], 10) : 0;
    if (c === "KeyM") muted = !muted;
    if (state === "play") {
      if (c === "Space" && !paused) useAbility();
      if (c === "KeyF" && !paused) deflect();
      if (c === "KeyR" && !paused) meltdown();
      if (c === "KeyP" || c === "Escape") paused = !paused;
    } else if (state === "menu") {
      if (num >= 1 && num <= HEROES.length) selMain = num - 1;
      if (c === "ArrowLeft") diffIdx = Math.max(0, diffIdx - 1);
      if (c === "ArrowRight") diffIdx = Math.min(DIFFS.length - 1, diffIdx + 1);
      if (c === "KeyC") { state = "companions"; grids.cat.s = 0; }
      if (c === "KeyU") state = "upgrades";
      if (c === "Enter" || c === "Space") startFromMenu();
    } else if (state === "upgrades") {
      if (c === "Escape" || c === "Enter" || c === "KeyU") state = "menu";
    } else if (state === "companions") {
      if (c === "Escape" || c === "Enter" || c === "Space" || c === "KeyC") closeCompanions();
    } else if (state === "level") {
      if (num >= 1 && choices[num - 1]) applyChoice(choices[num - 1]);
    } else if (state === "recruit") {
      if (!recAll && num >= 1 && recChoices[num - 1]) recruit(recChoices[num - 1]);
      if (recAll && c === "Escape") recAll = false;
    } else if ((state === "over" || state === "win") && overT > 0.8) {
      if (c === "Enter" || c === "Space") startFromMenu();
      if (c === "Escape") toMenu();
    }
  }
  keys[e.code] = true;
});
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (state === "play") paused = true; });
cv.addEventListener("pointermove", e => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (menuDrag) { const dy = menuDrag.y - e.clientY; if (Math.abs(dy) > 8) menuDrag.moved = true; if (menuDrag.moved && menuDrag.so) menuDrag.so.s = clamp(menuDrag.s + dy, 0, menuDrag.so.max); }
  if (joy && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; }
});
cv.addEventListener("pointerdown", e => {
  audio(); pointer.x = e.clientX; pointer.y = e.clientY;
  if (state === "upgrades") { clickRects(); return; }
  if (state === "menu" || state === "companions" || state === "recruit") { const so = scrollObj(); menuDrag = { y: e.clientY, s: so ? so.s : 0, moved: false, so }; return; }
  if (state === "level") { clickRects(); return; }
  if (state === "over" || state === "win") { if (overT > 0.8) clickRects(); return; }
  if (state === "play") {
    if (paused) { clickRects(); return; }
    if (clickRects()) return;
    if (Math.hypot(e.clientX - (W - 140), e.clientY - (H - 44)) < 34) { deflect(); return; }
    if (Math.hypot(e.clientX - (W - 212), e.clientY - (H - 44)) < 34) { meltdown(); return; }
    if (Math.hypot(e.clientX - (W - 62), e.clientY - (H - 140)) < 30) { sprintTog = !sprintTog; return; }
    if (hero.ab && Math.hypot(e.clientX - (W - 62), e.clientY - (H - 62)) < 50) { useAbility(); return; }
    joy = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  }
});
const endJoy = e => { if (joy && e.pointerId === joy.id) joy = null; };
cv.addEventListener("pointerup", e => {
  endJoy(e); pointer.x = e.clientX; pointer.y = e.clientY;
  if (menuDrag) { const d = menuDrag; menuDrag = null; if (!d.moved) clickRects(); }
});
cv.addEventListener("pointercancel", e => { endJoy(e); menuDrag = null; });
cv.addEventListener("wheel", e => { const so = scrollObj(); if (so) { so.s = clamp(so.s + e.deltaY, 0, so.max); e.preventDefault(); } }, { passive: false });

/* ================= loop ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; menuT += dt;
  if (state === "play" && !paused) { update(dt); updateFx(dt); }
  else if (state === "over" || state === "win") { overT += dt; if (shake > 0) shake = Math.max(0, shake - dt * 28); updateFx(dt); }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
