/* ================= level up ================= */
function openRecruit() {
  if (!canRecruit()) { recruitPending = 0; if (pending > 0) openLevel(); else state = "play"; return; }

}
function recruit(def) {
  addComp(def.name); recruitPending--; sfx.pickup();
  if (recruitPending > 0 && canRecruit()) { rollRecruit(); state = "recruit"; return; }
  recruitPending = 0;
  if (pending > 0) openLevel(); else state = "play";
}
function openLevel() {
  const pool = [];
  for (const id in WDEF) {
    if ((wl[id] || 0) >= (id === "blade" ? 1 : 5)) continue;
    // Special weapons are rare; Luck raises their appearance chance without changing ordinary upgrades.
    const rareChance = RARE_WEAPON_CHANCE[id];
    if (rareChance && !wl[id] && Math.random() > Math.min(0.85, rareChance * (1 + 0.75 * upRank("luck")))) continue;
    pool.push({ kind: "w", id });
  }
  for (const id in PDEF) if ((pl[id] || 0) < 5) pool.push({ kind: "p", id });
  const out = [];
  while (out.length < 3 && pool.length) out.push(pool.splice(rint(0, pool.length - 1), 1)[0]);
  while (out.length < 3) out.push({ kind: "heal", id: "chicken" });
  if (canRecruit() && !out.some(o => o.kind === "recruit") && (level % 3 === 0 || Math.random() < 0.1)) out[rint(0, out.length - 1)] = { kind: "recruit", id: "recruit" };
  choices = out; state = "level"; sfx.level();
}
function applyChoice(c) {
  if (c.kind === "w") wl[c.id] = (wl[c.id] || 0) + 1;
  else if (c.kind === "p") {
    pl[c.id] = (pl[c.id] || 0) + 1;
    if (c.id === "heart") { P.hp = Math.min(stat().maxhp, P.hp + 25); }
  } else if (c.kind === "recruit") recruitPending++;
  else P.hp = Math.min(stat().maxhp, P.hp + stat().maxhp * 0.5);
  pending--; levelTitle = "LEVEL UP!";
  if (pending > 0) openLevel(); else if (recruitPending > 0) openRecruit(); else state = "play";
  sfx.pickup();
}
